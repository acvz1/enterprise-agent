<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS 企业知识库 Agent · 面试思维导图</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#f7f8fc, #11131a);
      --surface: light-dark(#ffffff, #1b1e27);
      --surface-soft: light-dark(#f0f3fa, #242936);
      --ink: light-dark(#172033, #edf1fb);
      --muted: light-dark(#62708a, #aab5ca);
      --line: light-dark(#d7deeb, #3b4354);
      --blue: light-dark(#2667e8, #8eb2ff);
      --blue-soft: light-dark(#e8f0ff, #20345f);
      --green: light-dark(#167a55, #66d3a5);
      --green-soft: light-dark(#e4f7ed, #1c4436);
      --orange: light-dark(#ad6400, #ffc56a);
      --orange-soft: light-dark(#fff1d7, #4d3517);
      --red: light-dark(#ba3c4c, #ff9ba8);
      --red-soft: light-dark(#fde8eb, #4c252d);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); }
    button { font: inherit; }
    .page { max-width: 1440px; margin: 0 auto; padding: 30px 28px 42px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.04em; }
    h1 span { color: var(--blue); }
    .subtitle { margin: 0; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .tag { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .tag.done { color: var(--green); background: var(--green-soft); }
    .tag.base { color: var(--blue); background: var(--blue-soft); }
    .tag.limit { color: var(--orange); background: var(--orange-soft); }
    .tag.risk { color: var(--red); background: var(--red-soft); }

    .numbers { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 22px; }
    .metric { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
    .metric:last-child { border-right: 0; }
    .metric strong { display: block; color: var(--blue); font-size: 20px; font-weight: 650; }
    .metric span { color: var(--muted); font-size: 12px; }

    .workspace { display: grid; grid-template-columns: minmax(560px, 1.3fr) minmax(330px, .7fr); gap: 22px; align-items: start; }
    .map-shell, .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .map-shell { overflow: hidden; }
    .map-toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .map-toolbar p { margin: 0; color: var(--muted); font-size: 13px; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter, .node { border: 1px solid var(--line); color: var(--ink); background: var(--surface); cursor: pointer; }
    .filter { padding: 6px 9px; border-radius: 8px; font-size: 12px; }
    .filter[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
    .mindmap { position: relative; min-height: 610px; overflow: hidden; background: radial-gradient(circle at center, var(--blue-soft), transparent 34%); }
    .links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .links path { fill: none; stroke: var(--line); stroke-width: 2; }
    .node { position: absolute; width: 165px; padding: 12px 13px; border-radius: 13px; text-align: left; transition: transform .18s ease, border-color .18s ease, opacity .18s ease; }
    .node:hover, .node:focus-visible, .node.active { transform: translateY(-3px); border-color: var(--blue); outline: none; }
    .node .node-title { display: block; font-weight: 650; font-size: 14px; }
    .node .node-subtitle { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .node.hidden { opacity: .2; pointer-events: none; }
    .node.center { width: 205px; padding: 20px 18px; border-color: var(--blue); background: var(--blue); color: white; text-align: center; }
    .node.center .node-title { font-size: 19px; }
    .node.center .node-subtitle { color: #e8efff; }
    .node[data-kind="done"] { border-left: 4px solid var(--green); }
    .node[data-kind="base"] { border-left: 4px solid var(--blue); }
    .node[data-kind="limit"] { border-left: 4px solid var(--orange); }
    .node[data-kind="risk"] { border-left: 4px solid var(--red); }

    .detail { padding: 21px; position: sticky; top: 18px; }
    .detail .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .detail h2 { margin: 10px 0 6px; font-size: 25px; letter-spacing: -.03em; }
    .detail .lead { margin: 0 0 17px; color: var(--muted); line-height: 1.7; }
    .answer { border-left: 3px solid var(--blue); background: var(--surface-soft); padding: 13px 14px; margin: 16px 0; line-height: 1.7; }
    .answer b { display: block; color: var(--blue); margin-bottom: 4px; font-size: 13px; }
    .detail h3 { margin: 20px 0 9px; font-size: 14px; }
    .bullets { margin: 0; padding-left: 18px; color: var(--ink); }
    .bullets li { margin: 7px 0; line-height: 1.55; }
    .code { display: inline-block; padding: 1px 5px; border-radius: 5px; background: var(--surface-soft); font-family: Consolas, monospace; font-size: .9em; }
    .question { margin-top: 8px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); line-height: 1.5; }
    .question b { color: var(--ink); }
    .footnote { margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }

    @media (max-width: 1080px) { .workspace { grid-template-columns: 1fr; } .detail { position: static; } }
    @media (max-width: 760px) {
      .page { padding: 20px 14px 30px; } header { display: block; } .legend { justify-content: flex-start; margin-top: 12px; }
      .numbers { grid-template-columns: repeat(3, 1fr); } .metric:nth-child(3) { border-right: 0; } .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
      .map-toolbar { display: block; } .filters { margin-top: 10px; }
      .mindmap { min-height: 690px; overflow: auto; } .links { display: none; }
      .node { width: calc(100% - 30px); left: 15px !important; transform: none !important; }
      .node.center { width: calc(100% - 30px); }
      .node:hover, .node:focus-visible, .node.active { transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1><span>NEXUS</span> 企业知识库 Agent</h1>
        <p class="subtitle">面试快速定位图 · 点击节点，右侧直接出现答题主线、代码入口与追问角度。</p>
      </div>
      <div class="legend" aria-label="节点标记说明">
        <span class="tag done">我新增 / 改造</span>
        <span class="tag base">原项目基座</span>
        <span class="tag limit">当前边界</span>
        <span class="tag risk">真实 bad case</span>
      </div>
    </header>

    <section class="numbers" aria-label="关键数字速记">
      <div class="metric"><strong>500 / 50</strong><span>chunk 长度 / overlap</span></div>
      <div class="metric"><strong>384</strong><span>Embedding 向量维度</span></div>
      <div class="metric"><strong>RRF k = 60</strong><span>按 rank 融合双路</span></div>
      <div class="metric"><strong>TopK = 5</strong><span>送入回答上下文</span></div>
      <div class="metric"><strong>BM25 ≥ 0.3</strong><span>文本弱命中拦截</span></div>
      <div class="metric"><strong>15 问 / 0.93</strong><span>固定集 RRF Hit@3</span></div>
    </section>

    <section class="workspace" aria-label="面试思维导图与详情">
      <div class="map-shell">
        <div class="map-toolbar">
          <p>先点“完整请求链”，再按面试官问题跳转到对应模块。</p>
          <div class="filters" aria-label="筛选节点">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter" type="button" data-filter="done" aria-pressed="false">我的改造</button>
            <button class="filter" type="button" data-filter="risk" aria-pressed="false">bad case</button>
          </div>
        </div>
        <div class="mindmap" id="mindmap" aria-label="项目架构思维导图">
          <svg class="links" id="links" aria-hidden="true"></svg>
        </div>
      </div>

      <aside class="detail" aria-live="polite" id="detail"></aside>
    </section>
  </main>

  <script>
    const nodes = [
      {
        id: 'overview', kind: 'done', x: 39, y: 39, center: true,
        title: 'NEXUS · 企业知识库 Agent', subtitle: '二次开发主线',
        label: '项目总述', lead: '用它回答“项目做什么、完整请求怎样跑、你具体做了什么”。',
        answer: '我基于 Spring Boot 知识库系统二次开发，面向企业制度和业务文档，重点补了混合检索、权威数据补全、Agent 工具调用、权限过滤、引用返回和检索评测。一次提问会经过 JWT 鉴权、Redis 向量检索与 ES BM25 双路召回、RRF 融合、MySQL 补全，再让 RAG 或 Agent 基于引用证据回答。',
        points: ['我主讲的是双路检索、RRF、MySQL 权威补全、Agent Tool、部门范围过滤和拒答/评测。', 'MySQL 是权威数据；Redis 与 Elasticsearch 是可删除重建的检索索引。', '不要说成“生产级零幻觉平台”：当前没有 Reranker、复杂 ACL 和 MCP。'],
        questions: ['30 秒介绍项目。', '为什么用 Java 做企业 RAG，而不是 Python？', '最大亮点和最难的问题分别是什么？']
      },
      {
        id: 'flow', kind: 'done', x: 7, y: 9,
        title: '完整请求链', subtitle: '从用户问题到引用答案',
        label: '完整请求链', lead: '面试最重要的一张路线图。',
        answer: 'HTTP 请求先经过 JWT Filter 建立 SecurityContext；Controller 校验 qa:ask。随后 HybridRetrievalService 按当前用户部门范围并查 Redis 与 ES，RRF 选 TopK，RetrievalResultService 从 MySQL 批量补全为 RetrievalHit。普通 RAG 由 AiService 构建证据 Prompt；Agent 则由模型决定是否调用 KnowledgeBaseTool。最终返回答案和 citations，流式接口通过 SSE 分段返回。',
        points: ['入口鉴权：JwtAuthenticationFilter → SecurityContextHolder → @PreAuthorize。', '检索：Redis 语义 + ES 关键词 → RetrievalCandidate → RRF → RetrievalHit。', '回答：无证据直接拒答；有证据才调用模型并返回 citations。'],
        questions: ['一次 RAG 请求完整怎么跑？', '普通 RAG 与 Agent 的分叉点在哪里？', '为什么先检索再读答案缓存？']
      },
      {
        id: 'ingest', kind: 'base', x: 7, y: 63,
        title: '文档入库与同步', subtitle: '上传 → 解析 → 分块 → 三处存储',
        label: '文档入库与同步', lead: '用它回答 TXT / DOCX / PDF 如何进入知识库，以及更新时如何避免旧数据。',
        answer: '文件上传后，FileParseService 用 Apache Tika 抽取正文；DocumentChunkService 以 500 字、50 overlap 切分。更新时先删除该文档旧 Redis 向量和旧 MySQL chunk，再重新写入 chunk、Redis 向量；ES 侧按 documentId 删除旧索引、批量写入新 chunk，最后 refresh 一次。',
        points: ['组合键是 documentId + chunkIndex：同一文档的第几块，能精确对应三套存储。', '先删旧再建新保证重跑幂等，不会残留已删除正文的 chunk。', '真实边界：MySQL / Redis / ES 不是一个原子事务，重建中有短暂不一致窗口。'],
        questions: ['Tika 是什么？PDF 表格会怎样？', '为什么 chunk 要 overlap？过大或过小的后果？', '文档更新一致性如何保证？']
      },
      {
        id: 'hybrid', kind: 'done', x: 70, y: 8,
        title: '混合检索 + RRF', subtitle: 'Redis 语义 + ES BM25',
        label: '混合检索 + RRF', lead: '你最核心的二开技术点。',
        answer: 'Redis 将问题和 chunk 用同一个 384 维 Embedding 模型映射到向量空间，擅长语义近义表达；ES BM25 按词项匹配，擅长制度名、字段名、专有名词。两路各自返回 documentId、chunkIndex、rank，不直接相加不同量纲的 score；RRF 用 1/(60 + rank) 累加排名贡献，排序后取 TopK。',
        points: ['按 documentId + chunkIndex 去重：两条路命中同一切片时融合为一个候选。', 'RRF 用 rank 而不是原始 score，因为向量相似度和 BM25 _score 的尺度没有可比性。', 'RRF 后才 MySQL 批量补全标题与最新原文，避免候选阶段 N+1 查询。'],
        questions: ['为什么向量检索不够，还要 BM25？', '为什么 RRF，不用线性加权？', '为什么 MySQL 要放在 RRF TopK 后？']
      },
      {
        id: 'answer', kind: 'done', x: 70, y: 62,
        title: 'RAG / Agent 回答', subtitle: '证据、Tool、SSE、引用',
        label: 'RAG / Agent 回答', lead: '回答“为什么需要 Agent”“如何控制幻觉”“SSE 的作用”。',
        answer: '普通 RAG 的 AiService 固定执行检索：Hits 为空就返回固定拒答，不调用模型；否则将命中 chunk 组装进 Prompt，要求模型只依据证据回答，并把同一批 RetrievalHit 作为 citations 返回。Agent 路径由 LangChain4j 的 AiServices 创建，模型根据系统提示决定是否调用 searchKnowledgeBase 工具；工具返回结果后模型再生成回答。',
        points: ['引用不是模型临时编的，而是检索阶段已经得到的 RetrievalHit。', 'SSE 适合单向逐段推送生成文本；相比普通 HTTP，用户不必等全文完成。', 'Agent 的 Tool Calling 不是 MCP：这是项目内 LangChain4j 的 Java 方法调用。'],
        questions: ['为什么需要 Agent，而不全走固定 RAG？', '模型不调用工具或乱编怎么办？', '为什么 SSE，不用 WebSocket？']
      },
      {
        id: 'security', kind: 'done', x: 37, y: 81,
        title: '两层权限与部门范围', subtitle: 'qa:ask + document:read',
        label: '权限与企业场景', lead: '回答“用户能问”不等于“用户能读什么”。',
        answer: 'JWT Filter 从 token 解析用户并把权限放入 SecurityContextHolder。Controller 的 qa:ask 控制是否能发起问答；KnowledgeBaseTool 再检查 document:read。部门范围会先转成可读 documentId：ES 在查询时过滤，Redis 因适配器不支持 metadata filter 会多召回后在应用侧过滤，MySQL 补全时再做最终权威校验。',
        points: ['分开问答权限与文档读取权限，避免“能提问”自动等于能读取敏感文档。', '不同部门的答案缓存键纳入可见范围，不能把 HR 答案返回给普通员工。', '已实现的是简单“用户—部门—文档”范围；复杂 ABAC/ACL 属于后续，不应说成已完成。'],
        questions: ['权限过滤为何不能放在生成答案最后？', '为什么 Redis 要多召回 3 倍？', '如何扩展复杂部门权限？']
      },
      {
        id: 'evaluation', kind: 'done', x: 3, y: 37,
        title: '评测与可讲数据', subtitle: '15 问固定集 · Hit@3',
        label: '评测与证据', lead: '把“检索更好”变成可复现的测试，而不是主观感受。',
        answer: '固定 15 个问题，分别跑 Redis 向量、BM25 和 RRF，按“标准答案所在 chunk 是否出现在前三条”计算 Hit@3。当前固定集里，RRF Hit@3 为 0.93，向量单路为 0.80；该数据只能说明这套固定语料上的检索效果，不能泛化成所有企业文档的真实准确率。',
        points: ['Hit@3 的人话：正确证据有没有进入前三条，先验证检索，不能代表最终回答一定正确。', '评测要同时覆盖语义问法、关键词问法与多 chunk 问题。', '答案层还需要看“引用是否真正支持答案、该拒答时是否拒答”。'],
        questions: ['15 问怎么构造？Hit@3 是什么？', '为什么 RRF 可能低于 BM25 单路？', '如何补充更完整的评估？']
      },
      {
        id: 'badcase', kind: 'risk', x: 68, y: 83,
        title: '真实 bad case', subtitle: '已验证 + 待补测边界',
        label: '真实 bad case', lead: '不要回避边界；说清“现在如何处理、还差什么”反而加分。',
        answer: '已验证的一个边界是：无标点、无换行的长文本会被递归切分器硬切；在测试中 overlap 10 与 50 都没能让完整证据保留在同一块。另一个已覆盖行为是：最终检索为空时，服务端固定拒答且不调用模型。',
        points: ['表格型 PDF/Word：文本被线性化，行列关系可能被拆散。', '多证据题：规则和例外分属不同 chunk，Hit@3 命中一块不代表回答完整。', '低相关误召回：当前拒答只保证 Hits 为空；若弱相关 chunk 进入 TopK，模型仍可能组织出不可靠回答。'],
        questions: ['“公司裁员计划”只召回员工手册时怎么办？', '低相关阈值解决了什么，没解决什么？', '下一步最值得补哪三个测试？']
      },
      {
        id: 'boundary', kind: 'limit', x: 38, y: 6,
        title: '不夸大的边界', subtitle: '当前已知不足 / P2',
        label: '当前边界', lead: '直接承认并给出合理后续方向，不把计划冒充成果。',
        answer: '当前没有 Reranker，因此 RRF 后仍可能保留低相关候选；没有跨 MySQL、Redis、ES 的事务或消息补偿；部门权限没有完整 HTTP 端到端验收；Agent 是否调用工具主要依赖系统提示与模型决策。',
        points: ['下一步可补：带标注的多证据 / 误召回 / 权限对照评测。', '再往后才考虑：Reranker、版本化索引切换或 Outbox、复杂 ACL/ABAC。', '这些是“后续优化”，不能写成当前简历成果。'],
        questions: ['为什么当前没上 Reranker？', '索引同步失败如何恢复？', '如何低成本提升 Tool 调用判断？']
      }
    ];

    const map = document.getElementById('mindmap');
    const links = document.getElementById('links');
    const detail = document.getElementById('detail');
    const isMobile = () => window.matchMedia('(max-width: 760px)').matches;
    let selected = 'overview';

    function nodePosition(node) {
      if (isMobile()) return { left: 15, top: 14 + nodes.indexOf(node) * 74 };
      const mapWidth = map.clientWidth;
      const mapHeight = map.clientHeight;
      return { left: Math.round(mapWidth * node.x / 100), top: Math.round(mapHeight * node.y / 100) };
    }

    function createNodes() {
      map.querySelectorAll('.node').forEach(el => el.remove());
      nodes.forEach(node => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `node ${node.center ? 'center ' : ''}${selected === node.id ? 'active' : ''}`;
        button.dataset.id = node.id;
        button.dataset.kind = node.kind;
        button.innerHTML = `<span class="node-title">${node.title}</span><span class="node-subtitle">${node.subtitle}</span>`;
        button.addEventListener('click', () => selectNode(node.id));
        map.appendChild(button);
      });
      positionNodes();
    }

    function positionNodes() {
      nodes.forEach(node => {
        const button = map.querySelector(`[data-id="${node.id}"]`);
        const { left, top } = nodePosition(node);
        button.style.left = `${Math.max(10, Math.min(left, map.clientWidth - button.offsetWidth - 10))}px`;
        button.style.top = `${top}px`;
      });
      drawLinks();
    }

    function drawLinks() {
      links.innerHTML = '';
      if (isMobile()) return;
      const center = map.querySelector('[data-id="overview"]');
      if (!center) return;
      const c = { x: center.offsetLeft + center.offsetWidth / 2, y: center.offsetTop + center.offsetHeight / 2 };
      nodes.filter(n => !n.center).forEach(node => {
        const target = map.querySelector(`[data-id="${node.id}"]`);
        const t = { x: target.offsetLeft + target.offsetWidth / 2, y: target.offsetTop + target.offsetHeight / 2 };
        const horizontal = Math.abs(t.x - c.x) > Math.abs(t.y - c.y);
        const control = horizontal ? (t.x + c.x) / 2 : c.x;
        const controlY = horizontal ? c.y : (t.y + c.y) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${c.x} ${c.y} Q ${control} ${controlY} ${t.x} ${t.y}`);
        links.appendChild(path);
      });
    }

    function selectNode(id) {
      selected = id;
      const node = nodes.find(item => item.id === id);
      document.querySelectorAll('.node').forEach(button => button.classList.toggle('active', button.dataset.id === id));
      detail.innerHTML = `
        <div class="eyebrow"><span class="tag ${node.kind === 'done' ? 'done' : node.kind === 'base' ? 'base' : node.kind === 'risk' ? 'risk' : 'limit'}">${node.kind === 'done' ? '我新增 / 改造' : node.kind === 'base' ? '原项目基座' : node.kind === 'risk' ? '真实边界' : '当前边界'}</span><span>${node.label}</span></div>
        <h2>${node.title}</h2>
        <p class="lead">${node.lead}</p>
        <div class="answer"><b>面试时可以这样答</b>${node.answer}</div>
        <h3>答题要点</h3>
        <ul class="bullets">${node.points.map(point => `<li>${point}</li>`).join('')}</ul>
        <h3>面试官可能从这里追问</h3>
        ${node.questions.map(question => `<div class="question"><b>→</b> ${question}</div>`).join('')}
        <div class="footnote">提示：蓝/绿节点是当前可讲的已实现内容；橙/红节点用于诚实说明边界与 bad case。回答时先讲“当前怎么做”，再讲“下一步怎么补”。</div>`;
    }

    document.querySelectorAll('.filter').forEach(button => {
      button.addEventListener('click', () => {
        const filter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        document.querySelectorAll('.node').forEach(node => node.classList.toggle('hidden', filter !== 'all' && node.dataset.kind !== filter));
      });
    });

    createNodes();
    selectNode(selected);
    new ResizeObserver(positionNodes).observe(map);
  </script>
</body>
</html>
